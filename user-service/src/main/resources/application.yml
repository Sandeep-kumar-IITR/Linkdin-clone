spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306:user_db?createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port:8081

# JWT CONFIG

jwt:
  secret:
  expiration:
  refresh-expiration:

# AWS CONFIG

aws:
  access-key:
  secret-key:
  region:
  s3:
    bucket-name:

management:
  endpoint:
    web:
      exposure:
        include: health,info

